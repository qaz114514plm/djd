name: Build Violet Kernel (GPU 895 OC)
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        run: |
          git clone --depth=1 --branch lineage-22.2 https://github.com/LineageOS/android_kernel_xiaomi_sm6150.git kernel
      - name: Apply GPU 895 OC patch
        run: |
          cd kernel
          git apply --verbose ../gpu-895-oc.patch || patch -p1 < ../gpu-895-oc.patch
          grep -c 895000000 arch/arm64/boot/dts/qcom/sm6150-gpu.dtsi
      - name: Install toolchain
        run: |
          mkdir -p prebuilts
          # LOS官方clang(与内核配套)
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main-kernel-build-2024/clang-r487747c.tar.gz -O clang.tar.gz || true
          mkdir -p clang && tar -xf clang.tar.gz -C clang 2>/dev/null || echo "用备用工具链"
          sudo apt-get update -qq && sudo apt-get install -y -qq flex bison bc libssl-dev libelf-dev lzop ccache
      - name: Build
        working-directory: kernel
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export ARCH=arm64 SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          make O=out ARCH=arm64 CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            sdmsteppe-perf_defconfig vendor/violet.config
          make O=out ARCH=arm64 CC=clang -j$(nproc) \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            Image.gz dtbo.img || make O=out ARCH=arm64 CC=clang -j$(nproc) CROSS_COMPILE=aarch64-linux-gnu- Image.gz
          ls -la out/arch/arm64/boot/
      - name: AnyKernel3 pack
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          cd ak3
          rm -rf .git README.mk
          sed -i 's/^kernel.string=.*/kernel.string=Violet GPU-895-OC Kernel by FJ/; s/^do.devicecheck=.*/do.devicecheck=0/' anykernel.sh
          cp ../kernel/out/arch/arm64/boot/Image.gz Image.gz
          mkdir -p dtbo
          if [ -f ../kernel/out/arch/arm64/boot/dtbo.img ]; then cp ../kernel/out/arch/arm64/boot/dtbo.img dtbo.img; fi
          zip -r9 ../Violet_GPU895OC_$(date +%Y%m%d).zip .
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: violet-kernel-zip
          path: Violet_GPU895OC_*.zip
